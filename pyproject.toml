[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-analyzer"
version = "0.1.0"
description = "Service for automated codebase analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "python-dotenv",
    "gitpython",
    "mcp",
]

[tool.setuptools.packages.find]
include = ["app*"]