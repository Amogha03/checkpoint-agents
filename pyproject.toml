[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-analyzer"
version = "0.1.0"
description = "Clone and scan service for automated codebase analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "langgraph",
    "langchain",
    "gitpython",
]

[tool.setuptools.packages.find]
include = ["app*"]